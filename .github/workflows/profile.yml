name: Update profile

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/profile.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml

concurrency:
  group: profile-update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check Metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo '::error::Add the METRICS_TOKEN repository secret using a classic token with no scopes.'
            exit 1
          fi
      # Commits github-metrics.svg, which README.md embeds.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: ${{ github.head_ref || github.ref_name }}
          user: nicoleman0
          filename: github-metrics.svg
          base: header, repositories
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
          plugin_notable_repositories: yes
          plugin_notable_self: no
          config_timezone: Europe/London
          config_animations: no
          plugins_errors_fatal: yes
